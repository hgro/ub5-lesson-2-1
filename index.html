<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schaltterme aufstellen</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f6f4; --card:#ffffff; --ink:#1b2a27; --muted:#5b6b67; --line:#c9d6d1;
  --accent:#0f6b5c; --accent-ink:#ffffff; --sel:#dff0ea;
  --ok:#1d7a3a; --ok-bg:#dcf2e1; --bad:#b3261e; --bad-bg:#fbe2df;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121a18; --card:#1b2624; --ink:#e6efec; --muted:#9bb0aa; --line:#33443f;
    --accent:#4fc3a8; --accent-ink:#0b1513; --sel:#244039;
    --ok:#7fd99a; --ok-bg:#1d3a27; --bad:#ff9d94; --bad-bg:#432220;
  }
}
:root[data-theme="dark"]{
  --bg:#121a18; --card:#1b2624; --ink:#e6efec; --muted:#9bb0aa; --line:#33443f;
  --accent:#4fc3a8; --accent-ink:#0b1513; --sel:#244039;
  --ok:#7fd99a; --ok-bg:#1d3a27; --bad:#ff9d94; --bad-bg:#432220;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.6rem;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px}
.card.ok{background:var(--ok-bg);border-color:var(--ok)}
.card.bad{background:var(--bad-bg);border-color:var(--bad)}
.card h2{font-size:1rem;margin:0 0 4px;color:var(--muted);font-weight:600}
svg{display:block;width:100%;max-width:270px;height:auto;margin:0 auto 8px}
svg *{stroke:var(--ink)}
svg text{fill:var(--ink);stroke:none;font-family:Consolas,"Courier New",monospace;font-weight:600}
svg .box{fill:var(--card);stroke-width:2}
svg line,svg circle{stroke-width:2}
svg circle{fill:var(--card)}
.answer{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.eq{font-family:Consolas,"Courier New",monospace;font-weight:700;font-size:1.2rem}
.slot{
  flex:1;min-height:52px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  border:2px dashed var(--line);border-radius:10px;padding:6px;
}
.slot .hint{color:var(--muted);font-size:.85rem;padding:0 4px}
.pool{display:flex;flex-wrap:wrap;gap:6px}
button.tile{
  font-family:Consolas,"Courier New",monospace;font-size:1.25rem;font-weight:700;
  min-width:2.4em;height:2.4em;border-radius:10px;cursor:pointer;padding:0 8px;
  border:2px solid var(--line);background:var(--card);color:var(--accent);
}
button.tile:hover:not(:disabled){border-color:var(--accent)}
button.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.tile:disabled{opacity:.3;cursor:default;border-style:dashed}
button.tile.placed{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{margin:8px 0 0;font-weight:600;font-size:.9rem;min-height:1.3em}
.card.ok .note{color:var(--ok)} .card.bad .note{color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:11px 20px;cursor:pointer;border:2px solid var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#msg{margin-top:18px;font-weight:600;min-height:1.5em}
#msg.ok{color:var(--ok)} #msg.bad{color:var(--bad)}
@media (max-width:700px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<main>
  <h1>Schaltterme aufstellen</h1>
  <p class="lead">Stelle zu jedem Schaltnetz den passenden Schaltterm auf. Tippe dazu die Bausteine in der richtigen Reihenfolge an. Nicht jeder Baustein wird gebraucht. Ein Baustein im Term lässt sich durch Antippen wieder entfernen.</p>

  <div class="grid" id="grid"></div>

  <div class="actions">
    <button class="btn primary" id="check" disabled>Prüfen</button>
    <button class="btn ghost" id="reset">Zurücksetzen</button>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
</main>

<script>
/* ===== Einstellung für die Lehrkraft =====
   Variablennamen hier ändern, z. B. ["x","y"].
   Alternativ per Link: …?vars=x,y */
let VARS = ["a","b"];
try{
  const q = new URLSearchParams(location.search).get("vars");
  if(q){ const v = q.split(",").map(s=>s.trim()).filter(Boolean); if(v.length===2) VARS = v; }
}catch(e){}

const AND="∧", OR="∨", NOT="¬";
// Aufgaben: Gatter und Eingänge (Index in VARS)
const tasks = [
  {gate:"AND", ins:[0,1]},
  {gate:"NOT", ins:[0]},
  {gate:"OR",  ins:[0,1]},
  {gate:"NOT", ins:[1]}
];
const POOL = [VARS[0], VARS[1], NOT, AND, OR, "(", ")", "0", "1"];

function accepted(t){
  const a = VARS[t.ins[0]], b = VARS[t.ins[1]];
  if(t.gate==="NOT") return [NOT+a];
  const op = t.gate==="AND" ? AND : OR;
  return [a+op+b, b+op+a];
}
function balanced(s){
  let d=0; for(const c of s){ if(c==="(") d++; if(c===")"){ d--; if(d<0) return false; } } return d===0;
}

function gateSVG(t){
  const two = t.ins.length===2;
  const ys = two ? [45,75] : [60];
  const sym = t.gate==="AND" ? "&" : t.gate==="OR" ? "≥1" : "1";
  const outX = t.gate==="NOT" ? 177 : 165;
  let s = `<svg viewBox="0 0 270 120" role="img" aria-label="Schaltnetz mit ${t.gate==="AND"?"UND":t.gate==="OR"?"ODER":"NICHT"}-Gatter">`;
  s += `<rect class="box" x="95" y="25" width="70" height="70" rx="2"/>`;
  s += `<text x="130" y="50" font-size="20" text-anchor="middle">${sym}</text>`;
  t.ins.forEach((v,k)=>{
    s += `<line x1="46" y1="${ys[k]}" x2="95" y2="${ys[k]}"/>`;
    s += `<text x="38" y="${ys[k]+6}" font-size="18" text-anchor="end">${VARS[v]}</text>`;
  });
  if(t.gate==="NOT") s += `<circle cx="171" cy="60" r="6"/>`;
  s += `<line x1="${outX}" y1="60" x2="224" y2="60"/>`;
  s += `<text x="234" y="66" font-size="18">Q</text></svg>`;
  return s;
}

let ans = tasks.map(()=>[]);
let checked = false;
const grid = document.getElementById("grid");
const msg = document.getElementById("msg");
const checkBtn = document.getElementById("check");

function evaluate(i){
  const s = ans[i].map(k=>POOL[k]).join("");
  const bare = s.replace(/[()]/g,"");
  if(!balanced(s) || !accepted(tasks[i]).includes(bare)) return {ok:false, note:"Noch nicht richtig. Du kannst den Term ändern."};
  return s===bare ? {ok:true, note:"Richtig."} : {ok:true, note:"Richtig. Die Klammern sind hier nicht nötig."};
}

function render(){
  grid.innerHTML = "";
  tasks.forEach((t,i)=>{
    const card = document.createElement("div");
    card.className = "card";
    let res = null;
    if(checked){ res = evaluate(i); card.classList.add(res.ok?"ok":"bad"); }
    card.innerHTML = `<h2>Schaltnetz ${i+1}</h2>${gateSVG(t)}
      <div class="answer"><span class="eq">Q =</span><div class="slot" aria-label="Dein Schaltterm"></div></div>
      <div class="pool"></div>
      <p class="note">${res?res.note:""}</p>`;
    const slot = card.querySelector(".slot");
    if(!ans[i].length) slot.innerHTML = `<span class="hint">Bausteine antippen</span>`;
    ans[i].forEach(k=>{
      const b = document.createElement("button");
      b.type="button"; b.className="tile placed"; b.textContent = POOL[k];
      b.title = "Entfernen"; b.setAttribute("aria-label", `${POOL[k]} entfernen`);
      b.onclick = ()=>{ ans[i] = ans[i].filter(x=>x!==k); change(); };
      slot.append(b);
    });
    const pool = card.querySelector(".pool");
    POOL.forEach((p,k)=>{
      const b = document.createElement("button");
      b.type="button"; b.className="tile"; b.textContent=p;
      b.disabled = ans[i].includes(k);
      b.setAttribute("aria-label", `Baustein ${p}`);
      b.onclick = ()=>{ ans[i].push(k); change(); };
      pool.append(b);
    });
    grid.append(card);
  });
  checkBtn.disabled = ans.some(a=>a.length===0);
}

function change(){ checked=false; msg.className=""; msg.textContent=""; render(); }

checkBtn.onclick = ()=>{
  checked = true;
  const n = tasks.filter((_,i)=>evaluate(i).ok).length;
  if(n===tasks.length){ msg.className="ok"; msg.textContent="Alles richtig. Sehr gut!"; }
  else{ msg.className="bad"; msg.textContent = `${n} von ${tasks.length} richtig. Die rot markierten Schaltterme kannst du ändern.`; }
  render();
};

document.getElementById("reset").onclick = ()=>{
  ans = tasks.map(()=>[]); change();
};

render();
</script>
</body>
</html>
